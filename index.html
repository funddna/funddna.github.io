function toUI(x){
 const st=x.stats||{},b=x.bench||{},bs=b.stats||{},eq=x.holdings.filter(h=>h.type==='EQUITY');
 const topSec=(x.sectors.find(s=>!/Cash|Debt/.test(s[0]))||['—',0]);

 const dna=[st.r3!=null&&bs.r3!=null?clamp(50+3*(st.r3-bs.r3)):null,st.r6m!=null?clamp(50+3*st.r6m):null,st.vol!=null?clamp(100-st.vol*4):null,st.dd!=null?clamp(100+st.dd*2.5):null,x.top10!=null?clamp(x.top10*1.6):null,large!=null?clamp(large):null,x.equityShare!=null?clamp(x.equityShare):null,x.sectors?.length?clamp(100-topSec[1]*1.5):null];
 const lv=v=>v>=70?4:v>=50?3:2;
 const tv=x.turnover==null?null:x.turnover<30?1:x.turnover<70?3:5;
 const profile=[[`${topSec[0]}-heavy`,lv(topSec[1]*2)],[large==null?'Market-cap mix unknown':large>=60?'Large-cap tilted':large>=35?'Multi-cap mix':'Mid/small-cap tilted',large==null?1:lv(large)],[x.top10==null?'Concentration n/a':(x.top10>=50?'High':x.top10>=35?'Moderate':'Low')+' concentration',dna[4]==null?1:lv(dna[4])],[tv==null?'Turnover n/a':(tv===1?'Low':tv===3?'Moderate':'High')+' turnover',tv??1],[st.vol==null?'Volatility n/a':(st.vol>=16?'High':st.vol>=11?'Medium':'Low')+' volatility',st.vol==null?1:st.vol>=16?5:st.vol>=11?3:2],[st.r3==null||bs.r3==null?'3Y comparison n/a':st.r3>=bs.r3?'Ahead of index (3Y)':'Behind index (3Y)',st.r3==null||bs.r3==null?1:st.r3>=bs.r3?4:2]];
 const mg=x.managers||[],since=mg.map(m=>m.since).filter(Boolean).sort()[0];
 const yrs=since?((Date.now()-new Date(since))/3.156e10).toFixed(1)+' years':'—';
 return {code:x.code,name:x.name,category:x.category,holdingsCount:x.holdingsCount,er:x.er,plan:x.plan,nav:x.nav,aum:x.aum,navDate:x.navDate,portfolioDate:x.portfolioDate,sources:x.sources,coverage:x.coverage,
  stats:{r1:st.r1,r3:st.r3,vol:st.vol,beta:st.beta,sharpe:st.sharpe,dd:st.dd,er:x.er,top10:x.top10,large},
  benchStats:{r1:bs.r1,r3:bs.r3,vol:bs.vol,beta:1,sharpe:bs.r3!=null&&bs.vol?(bs.r3-6.5)/bs.vol:null,dd:bs.dd,er:null,top10:null,large:null},benchName:b.name||'Index',benchUrl:b.url,

function cover(section){cur=null;document.title='fundDNA | Explore funds';$('#app').innerHTML=`<div class="w cover"><p class="lbl">FUND RESEARCH / COVER</p><div class="cover-intro"><div><h1>There is more beneath the numbers.</h1><p class="lead">Follow the signals. Find the story inside the fund.</p></div><div class="cover-orbit" aria-hidden="true">Look<br>closer<br>↗</div></div><div class="cover-search"><label for="cover-q">Search any fund</label><input id="cover-q" class="directory-q" placeholder="Fund name or AMC" autocomplete="off" aria-label="Search any fund"><ul class="directory-results" role="listbox"></ul><p>Find a fund in the directory. Research is prepared on demand where holdings are available.</p></div><a class="portfolio-entry" href="#overlap"><small>EXPLORE / FUND OVERLAP</small><strong>Compare two funds</strong><span>Choose from the screened holdings universe. See shared stocks and disclosed weights. ↗</span></a><a class="portfolio-entry" href="#portfolio"><small>NEW / PORTFOLIO BUILDER</small><strong>Create a portfolio</strong><span>Answer multiple-choice questions in Basic or Advanced mode. See an equity-fund sketch from categories and holdings. ↗</span></a><h2>CHOOSE YOUR LENS</h2><div class="cover-grid">${views.map(([v,n,d],i)=>`<a class="cover-card" href="#${v}"><small>0${i+1}</small><b>${n}</b><span>${d}</span><i aria-hidden="true">↗</i></a>`).join('')}</div><div id="fund-picker" tabindex="-1"><div class="cover-search"><label for="picker-q">Search any fund${section?' for '+views.find(x=>x[0]===section)[1]:''}</label><input id="picker-q" class="directory-q" placeholder="Fund name or AMC" autocomplete="off" aria-label="Search any fund"><ul class="directory-results" role="listbox"></ul><p>Not limited to the funds below. Research is prepared on demand where holdings are available.</p></div><h2>FUNDS WE'RE TRACKING</h2><p class="tracked-intro">Six funds to start with, grouped by category. Search above for others.</p>${categories.map(([cat,fs])=>`<div class="category"><h3>${cat}</h3><div class="fund-list">${fs.map(([c,n])=>`<a class="fund-link" data-code="${c}" href="#${section||'research'}/${c}"><span>${n}<small class="card-fingerprint">Disclosed fingerprint loading…</small></span><span>${section?views.find(x=>x[0]===section)[1]:'Research'} ↗</span></a>`).join('')}</div></div>`).join('')}</div><p class="cap">Research refreshes after a material change is detected. NAV and prices can change sooner. Categories reflect the fund provider’s classification; ELSS is tax-saving equity.</p></div>`;bindDirectorySearch();updateNav();if(cardUniverse){document.querySelectorAll('.fund-link[data-code]').forEach(a=>{const f=cardUniverse[a.dataset.code];if(f){const d=holdingsFingerprint(f);a.querySelector('.card-fingerprint').textContent=`Shown top 10 ${d.top.toFixed(1)}% · Shown equity ${d.equity.toFixed(1)}% · Cash ${d.cash.toFixed(1)}% · ${d.date}`}})}else loadCardFingerprints();if(section){requestAnimationFrame(()=>{const el=$('#fund-picker');if(el){const y=el.getBoundingClientRect().top+scrollY-document.querySelector('header').offsetHeight-12;scrollTo({top:y,behavior:'smooth'});el.focus({preventScroll:true})}})}else scrollTo(0,0)}
function bindDirectorySearch(){document.querySelectorAll('.directory-q').forEach(input=>{const results=input.parentElement.querySelector('.directory-results');let timer;input.addEventListener('input',()=>{clearTimeout(timer);const term=input.value.trim();if(term.length<2){results.style.display='none';results.innerHTML='';return}timer=setTimeout(async()=>{try{const r=await getJ(`${API}/api/search?q=${encodeURIComponent(term)}`);if(input.value.trim()!==term)return;results.innerHTML=r.results.map(x=>`<li tabindex="0" role="option" data-id="${x.code}">${esc(x.name)}<small>${esc(x.amc)} · ${esc(x.category)}</small></li>`).join('')||'<li>No fund matches</li>'}catch(e){results.innerHTML='<li>Search unavailable</li>'}results.style.display='block'},220)});input.addEventListener('keydown',e=>{if(e.key==='Enter'){const first=results.querySelector('li[data-id]');if(first)pick(first.dataset.id)}});results.addEventListener('click',e=>{const item=e.target.closest('li[data-id]');if(item)pick(item.dataset.id)});results.addEventListener('keydown',e=>{if(e.key==='Enter'){const item=e.target.closest('li[data-id]');if(item)pick(item.dataset.id)}})})}
/* Local, rule-based portfolio sketch. No model call and no order placement. */
const portfolioUniverseUrl='data/portfolio-universe.json';
let overlapState={funds:null,a:'',b:''};
const overlapName=f=>`${f.name} [${f.code}]`;

function overlapPage(){cur=null;document.title='Fund overlap | fundDNA';const root=$('#app');root.innerHTML=`<div class="w overlap"><a href="#home">← All funds</a><p class="eyebrow">FUND RESEARCH / DISCLOSED HOLDINGS</p><h1>Where do funds meet?</h1><p class="intro">Pick any two funds in the screened directory. Shared named equity positions are matched within the published top 60 holdings for each fund. This is a partial, dated comparison, not a live trade feed.</p><div class="overlap-pickers"><label>First fund<input id="overlap-a" list="overlap-options" placeholder="Search a fund name" autocomplete="off"></label><label>Second fund<input id="overlap-b" list="overlap-options" placeholder="Search a different fund" autocomplete="off"></label></div><datalist id="overlap-options"></datalist><div id="overlap-result" class="overlap-result">Loading the screened holdings directory…</div></div>`;updateNav();scrollTo(0,0);loadOverlapUniverse()}
async function loadOverlapUniverse(){const root=$('#overlap-result');try{const u=await getJ(portfolioUniverseUrl),funds=u.funds.filter(f=>f.holdings?.length&&f.portfolioDate);overlapState.funds=funds;$('#overlap-options').innerHTML=funds.map(f=>`<option value="${esc(overlapName(f))}"></option>`).join('');$('#overlap-a').value=overlapState.a;$('#overlap-b').value=overlapState.b;renderOverlap()}catch(e){root.innerHTML='<p>Holdings data could not be loaded. No comparison was calculated.</p>'}}
function renderOverlap(){const root=$('#overlap-result');if(!root||!overlapState.funds)return;const funds=overlapState.funds,find=value=>funds.find(f=>overlapName(f)===value),a=find(overlapState.a),b=find(overlapState.b);if(!overlapState.a&&!overlapState.b){root.innerHTML=`<p>Select two funds from ${funds.length} screened direct-growth schemes with dated holdings. This is not the entire AMFI directory.</p>`;return}if(!a||!b||a.code===b.code){root.innerHTML='<p class="invalid">Choose two different funds from the suggestions above.</p>';return}const x=new Map();a.holdings.filter(h=>h.type==='EQUITY'&&h.weight>0).forEach(h=>{const k=overlapKey(h);if(k)x.set(k,h)});const common=b.holdings.filter(h=>h.type==='EQUITY'&&h.weight>0).map(h=>({first:x.get(overlapKey(h)),second:h})).filter(z=>z.first),sum=common.reduce((n,z)=>n+Math.min(z.first.weight,z.second.weight),0),rows=common.sort((u,v)=>Math.min(v.first.weight,v.second.weight)-Math.min(u.first.weight,u.second.weight));root.innerHTML=`<strong>${sum.toFixed(1)} percentage points</strong><p>Shared named equity exposure within shown holdings, calculated as the sum of the smaller disclosed weight for each matched stock. ${rows.length} shared stocks.</p>${rows.length?`<div class="tw"><table><thead><tr><th>SHARED STOCK</th><th>${esc(a.name)}</th><th>${esc(b.name)}</th></tr></thead><tbody>${rows.slice(0,20).map(z=>`<tr><td>${esc(z.first.name)}</td><td>${Number(z.first.weight).toFixed(2)}%</td><td>${Number(z.second.weight).toFixed(2)}%</td></tr>`).join('')}</tbody></table></div>`:'<p>No matching named equities in the shown top holdings.</p>'}<p class="overlap-notes">${esc(a.name)}: ${esc(a.portfolioDate)}, ${a.holdings.length} shown of ${a.holdingsCount} positions. ${esc(b.name)}: ${esc(b.portfolioDate)}, ${b.holdings.length} shown of ${b.holdingsCount} positions. Names are matched conservatively after punctuation and legal suffixes; different share classes, issuer names or indirect ETF exposures may be missed. The percentage-point figure is not full portfolio overlap. <a href="${disclosureUrl}" target="_blank" rel="noopener">AMC disclosures ↗</a></p>`}

function fpBands(sc,W,H,N,step){
 const nb=sc.length,bw=W/nb,q=H/300;
 const s=x=>{let t=Math.min(nb-1,Math.max(0,x/bw-.5)),i=Math.floor(t),j=Math.min(nb-1,i+1),u=t-i;u=u*u*(3-2*u);return sc[i]+(sc[j]-sc[i])*u};
 const y=(x,k)=>{const a=s(x);return 14+k*(H-28)/(N-1)+(2+a*10)*q*Math.sin(x/(34-a*20)+k*.55)+(1.5+a*4)*q*Math.sin(x/11-k*.9)};
 return sc.map((_,b)=>{let o='';for(let k=0;k<N;k++){const m=Math.round(bw/step);let d='';for(let i=0;i<=m;i++){const x=b*bw+bw*i/m;d+=(i?'L':'M')+x.toFixed(1)+' '+y(x,k).toFixed(1)}o+=`<path ${k%7==3?'class="a" ':''}pathLength="1" d="${d}" style="animation-delay:${k*35}ms"/>`}return o});
}

app.addEventListener('change',e=>{if(e.target.id==='peer'){peer=e.target.value;$('#cmp').innerHTML=cmpHTML()}});
const q=$('#q'),res=$('#res');
async function load(code,v='research',push=true){
 code=String(code);if(cur===code&&D.funds[code]){view=v;if(push)location.hash=v+'/'+code;render();scrollTo(0,0);if(!D.moves[code])getMoves(code);return}cur=code;view=v;q.value='';res.style.display='none';if(push)location.hash=v+'/'+code;
 if(!D.funds[code]){$('#app').innerHTML=`<div class="w"><section class="idn"><div><h1 class="mut">Loading fund…</h1><p class="stamp">Fetching holdings, NAV history and prices.</p></div></section></div>`;
  try{const x=await getJ(`${API}/api/fund?code=${code}`);D.funds[code]=toUI(x);D.asOfDate=new Date(x.seriesEnd||Date.now());if(!ids.includes(code))ids.push(code);try{localStorage.setItem('fd_recent',JSON.stringify(ids.slice(-6)))}catch(e){}}
  catch(e){$('#app').innerHTML=`<div class="w"><section class="idn"><div><h1>Couldn’t load this fund</h1><p class="stamp">${esc(e.message)}. Holdings may not be published for this scheme (e.g. some debt, FoF or closed schemes).</p></div></section></div>`;return}}
 if(cur!==code)return;render();scrollTo(0,0);if(!D.moves[code])getMoves(code);
 if(!D.analysis[code]){D.analysis[code]={loading:true};
  getAnalysis(code);}
}
// Analysis: nightly prebuilt file first; otherwise ask the API, which runs the research in the
// background and answers quickly. Short polls instead of one long request.
async function getAnalysis(code){
 const set=a=>{D.analysis[code]=a;if(cur===code)render()};
 let pre=null;try{pre=await getJ(`data/analysis/${code}.json`)}catch(e){}
 if(pre&&pre.holdings&&pre.holdings.length)return set(pre);
 for(let i=0;i<14;i++){
  let r=null;try{const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);r=await getJ(`${API}/api/analysis?code=${code}${i?'&poll='+i:''}`,{signal:c.signal});clearTimeout(t)}catch(e){r=null}
  if(cur!==code&&D.analysis[code]&&!D.analysis[code].loading)return;
  if(r&&r.holdings&&r.holdings.length&&!r.pending&&!r.unavailable)return set(r);
  if(r&&r.unavailable){const old=(r.holdings&&r.holdings.length)?r:(pre&&pre.holdings&&pre.holdings.length?pre:null);return set(old?{...old,staleNote:true}:{unavailable:true,reason:r.reason,retryAt:r.retryAt})}
  const old=(r&&r.holdings&&r.holdings.length)?r:(pre&&pre.holdings&&pre.holdings.length?pre:null);
  if(old){set({...old,refreshing:true})}else set({loading:true,checkBack:true});
  await new Promise(z=>setTimeout(z,((r&&r.retryAfter)||20)*1000));
 }
 const cur0=D.analysis[code];if(cur0&&cur0.loading)set({unavailable:true,reason:'slow'});
}
const pick=id=>load(id,cur?view:(views.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'research'));
let qt;q.addEventListener('input',()=>{clearTimeout(qt);const t=q.value.trim();if(t.length<2){res.style.display='none';return}
 qt=setTimeout(async()=>{try{const r=await getJ(`${API}/api/search?q=${encodeURIComponent(t)}`);if(q.value.trim()!==t)return;
 res.innerHTML=r.results.map(x=>`<li data-id="${x.code}">${esc(x.name)}<span class="mut" style="display:block;font-size:12px">${esc(x.amc)} · ${esc(x.category)}</span></li>`).join('')||'<li>No fund matches</li>'}catch(e){res.innerHTML=`<li>Search unavailable</li>`}res.style.display='block'},220)});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const l=res.querySelector('li[data-id]');if(l)pick(l.dataset.id)}});
res.addEventListener('click',e=>{const l=e.target.closest('li[data-id]');if(l)pick(l.dataset.id)});
document.addEventListener('click',e=>{if(!e.target.closest('.srch'))res.style.display='none'});
(()=>{const i=new Date(Date.now()+(new Date().getTimezoneOffset()+330)*6e4),m=i.getHours()*60+i.getMinutes(),o=i.getDay()%6&&m>=555&&m<930;$('#mk').innerHTML=`<i class="dot ${o?'o':''}"></i>NSE ${o?'open':'closed'}`})();
addEventListener('resize',()=>{const c=$('#chart');if(c&&D.funds[cur])c.innerHTML=chartHTML()});
